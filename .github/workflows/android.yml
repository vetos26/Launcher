name: Android build

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish"
        required: false
        default: "v1.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The ubuntu-latest image ships with the Android SDK, so no extra action
      # is needed; AGP downloads any missing platform automatically.
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee build.log

      - name: Publish build log
        if: failure()
        shell: bash
        run: |
          {
            echo "## Gradle build output (tail)"
            echo '```'
            tail -c 50000 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize build
        if: success()
        shell: bash
        run: |
          {
            echo "## Build OK"
            echo '```'
            tail -c 4000 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: utouch-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: success() && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v1.2' }}
          name: Ubuntu Touch Launcher 1.2
          make_latest: true
          generate_release_notes: true
          body: |
            Debug APK собран GitHub Actions из ветки `${{ github.ref_name }}`.

            **Установка:** скачайте `app-debug.apk`, разрешите установку из этого источника,
            затем выберите лаунчер как домашний экран:
            *Настройки → Приложения → Приложения по умолчанию → Домашнее приложение*.
          files: app/build/outputs/apk/debug/app-debug.apk
