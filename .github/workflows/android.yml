name: Android build

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish"
        required: false
        default: "v1.5.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The ubuntu-latest image ships with the Android SDK, so no extra action
      # is needed; AGP downloads any missing platform automatically.
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice title=Signing::No signing secrets found - publishing the debug APK instead."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/utouch-launcher.p12"
          {
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/utouch-launcher.p12"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
            echo "SIGNING_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
            echo "SIGNING_KEY_ALIAS=${KEY_ALIAS:-utouch}"
          } >> "$GITHUB_ENV"

      - name: Build APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --console=plain --stacktrace 2>&1 | tee build.log

      - name: Pick the installable APK
        shell: bash
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/utouch-launcher.apk
            echo "APK_KIND=signed release" >> "$GITHUB_ENV"
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/utouch-launcher.apk
            echo "APK_KIND=debug (no signing key)" >> "$GITHUB_ENV"
          fi
          ls -l dist

      - name: Verify signature
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in the runner image, skipping verification"
            exit 0
          fi
          "$APKSIGNER" verify --print-certs dist/utouch-launcher.apk | head -20

      - name: Publish build log
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo "## Gradle build output (tail)"
            echo '```'
            tail -c 50000 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Step summaries are not readable through the API, annotations are. Emit the
          # compiler output as one multi-line annotation so CI failures can be inspected.
          combined=$(grep -E "^(e|error): " build.log | head -40 | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')
          if [ -n "$combined" ]; then
            echo "::error title=Gradle errors::$combined"
          fi

      - name: Summarize build
        if: success()
        shell: bash
        run: |
          {
            echo "## Build OK — $APK_KIND"
            echo '```'
            tail -c 4000 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: utouch-launcher
          path: dist/utouch-launcher.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: success() && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v1.5.1' }}
          name: Ubuntu Touch Launcher 1.5.1
          make_latest: true
          generate_release_notes: true
          body: |
            Debug APK собран GitHub Actions из ветки `${{ github.ref_name }}`.

            **Подпись:** ${{ env.APK_KIND }}. Начиная с 1.5.1 APK подписан постоянным ключом,
            поэтому обновления ставятся поверх без удаления приложения.

            **Установка:** скачайте `utouch-launcher.apk`, разрешите установку из этого источника,
            затем выберите лаунчер как домашний экран:
            *Настройки → Приложения → Приложения по умолчанию → Домашнее приложение*.
          files: dist/utouch-launcher.apk
